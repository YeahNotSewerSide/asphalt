[package]
name = "asphalt"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = { version = "0.4.3", features = ["serde"] }
hpke = { version = "0.15.1", default-features = false, features = ["getrandom", "alloc", "mlkem", "chacha", "hkdfsha2", "x25519"] }
libp2p = { version = "0.57.1", features = ["tokio", "quic", "ping", "request-response", "cbor", "macros", "ed25519"] }
num-bigint = { version = "0.5.1", features = ["rand_0_10", "rand_core_0_10", "serde"] }
rand = "0.10.3"
rpassword = "7.5.4"
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["macros", "migrate", "runtime-tokio", "sqlite"], default-features = false }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.1"
